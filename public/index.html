<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Overview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Server Overview</p>
          <h1>Work server status</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh status" title="Refresh status">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
            <path d="M20 4v6h-6"></path>
          </svg>
        </button>
      </header>

      <section class="summary" aria-live="polite">
        <div class="summary-status">
          <span class="status-light unknown" id="summaryLight"></span>
          <span id="summaryText">No servers added yet</span>
        </div>
        <time id="checkedAt">Not checked yet</time>
      </section>

      <form class="add-server" id="addServerForm" autocomplete="off">
        <label for="shortName">Add server</label>
        <div class="add-server-row">
          <input id="shortName" name="shortName" type="text" inputmode="url" placeholder="short name" pattern="[A-Za-z0-9-]+" aria-describedby="domainSuffix" required>
          <span id="domainSuffix">.eda.cit.tum.de</span>
          <button class="add-button" type="submit" aria-label="Add server" title="Add server">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>
        </div>
        <p class="form-message" id="formMessage" aria-live="polite"></p>
      </form>

      <section class="server-grid" id="serverGrid" aria-label="Servers"></section>
      <p class="empty-state" id="emptyState">Add a short name above to start monitoring a server.</p>
    </main>

    <template id="serverTemplate">
      <article class="server-card">
        <div class="server-main">
          <span class="status-light unknown"></span>
          <div>
            <h2></h2>
            <input class="server-description" type="text" maxlength="80" aria-label="Server info">
          </div>
        </div>
        <dl class="server-details">
          <div>
            <dt>Host</dt>
            <dd data-field="host"></dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd data-field="status"></dd>
          </div>
          <div>
            <dt>Latency</dt>
            <dd data-field="latency"></dd>
          </div>
          <div>
            <dt>Reachable by</dt>
            <dd data-field="checks"></dd>
          </div>
        </dl>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
